# pvmon example: Solis S6 hybrid + Shelly Pro 3EM as grid meter + two wallboxes
# (go-e Charger and Tinkerforge WARP3). Replace the addresses with your own; everything
# not set here has a default (spec section 3). The time zone comes from TZ only.

app:
  port: 8080
  log_level: info

storage:
  path: ./data/pvmon.db # inside the container: /app/data (volume)

site:
  name: Home
  interval: 5s # poll interval of every device; a device may set its own

connections:
  # Solis via a Modbus TCP gateway (e.g. Waveshare RS485-to-ETH) ...
  lan-solis: { address: "tcp://10.0.0.20:502", timeout: 2s }
  # ... or directly via a USB RS485 adapter (map the device in compose.yaml):
  # rs485: { address: "rtu:///dev/ttyUSB0", speed: 9600, parity: N, stop_bits: 1 }

devices:
  wr1:   { connection: lan-solis, unit: 1, profile: solis/s6-hybrid }
  meter: { address: "http://10.0.0.31", profile: shelly/pro-3em, interval: 2s } # faster grid meter
  goe:   { address: "http://10.0.0.40", profile: goe/charger-v2, interval: 10s }
  warp:  { address: "http://10.0.0.41", profile: tinkerforge/warp3, interval: 10s }
  # With login enabled on the WARP, add (secrets only as references, e.g. from .env):
  #   auth: { user: admin, password: "${env:WARP_PASSWORD}" }

meters:
  # PV total from the inverter; the strings (MPPTs) sit below it and are never added again.
  pv:        { device: wr1, source: pv, kwp: 10, label: Roof }
  pv-mppt1:  { device: wr1, source: pv1, parent: pv, label: South }
  pv-mppt2:  { device: wr1, source: pv2, parent: pv, label: West }
  battery:   { device: wr1, source: battery, capacity: 10kWh }
  backup:    { device: wr1, source: backup }
  # The inverter's own grid values become diagnostics; the Shelly is the grid meter.
  inv-grid:  { device: wr1, source: grid, role: inverter }
  grid:      { device: meter, source: total, critical: true }
  wb-garage: { device: goe, source: charger, label: Garage }
  wb-drive:  { device: warp, source: charger, label: Driveway }
