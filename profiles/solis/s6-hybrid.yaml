    0x1019: { level: fault, text: { en: "Grid current sampling error", de: "Netzstrom-Messfehler" } }
    0x1020: { level: fault, text: { en: "DC overvoltage", de: "DC-Überspannung" } }
    0x1021: { level: fault, text: { en: "DC bus overvoltage", de: "DC-Bus-Überspannung" } }
    0x1022: { level: fault, text: { en: "DC bus unbalanced voltage", de: "DC-Bus-Spannungsunsymmetrie" } }
