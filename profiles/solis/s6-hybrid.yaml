# Profile, schema: SPEC.md section 4.2.
schema: 1
profile: solis/s6-hybrid
version: 5
vendor: Solis
models: ["S6-EH1P*", "S6-EH3P*", "RHI-*"]
transport: modbus
verified: true            # register map verified on a real device; fixture pending
modbus: { function: input, byte_order: big, word_order: big }
read:
  mode: range
  max_registers: 125
  # ranges: [[33000, 33096], [33116, 33180], [33251, 33286], [33580, 33596]]
  ranges:            # 112 registers
    - [33035, 33058]   # 33035, PV strings; pv.power u32 ends 33058
    - [33094, 33150]   # 33095, faults 33116–33121, battery 33133/33135/33139, backup 33148, battery.power u32 33149–33150
    - [33162, 33167]   # battery daily counters
    - [33263, 33286]   # grid.power i32, lifetime counters u32 33283–33286
    - [33596, 33596]   # backup.energy_in
max_power: 70000          # W, glitch guard for the grid's lifetime counters: the external
                          # meter's range (3 x 100 A x 230 V, rounded up), not the inverter's
netting: app

blocks:
  pv:                     # whole PV field; strings pv1–pv4 may sit below it (parent: <pv meter>)
    role: pv
    channels:
      power:      { addr: 33057, type: u32, scale: 1, unit: W }
      energy_out: { addr: 33035, type: u16, scale: 0.1, unit: kWh, counter: daily_reset, reset_group: daily, resolution: 0.1 }
  pv1:
    role: pv
    channels:
      voltage:    { addr: 33049, type: u16, scale: 0.1, unit: V, history: false }
      current:    { addr: 33050, type: u16, scale: 0.1, unit: A, history: false }
      power:      { product: [pv1.voltage, pv1.current], unit: W }
      energy_out: { derive: share, of: pv.energy_out, by: power }   # estimated
  pv2:
    role: pv
    channels:
      voltage:    { addr: 33051, type: u16, scale: 0.1, unit: V, history: false }
      current:    { addr: 33052, type: u16, scale: 0.1, unit: A, history: false }
      power:      { product: [pv2.voltage, pv2.current], unit: W }
      energy_out: { derive: share, of: pv.energy_out, by: power }
  pv3:                    # 4-MPPT models only
    role: pv
    channels:
      voltage:    { addr: 33053, type: u16, scale: 0.1, unit: V, history: false }
      current:    { addr: 33054, type: u16, scale: 0.1, unit: A, history: false }
      power:      { product: [pv3.voltage, pv3.current], unit: W }
      energy_out: { derive: share, of: pv.energy_out, by: power }
  pv4:
    role: pv
    channels:
      voltage:    { addr: 33055, type: u16, scale: 0.1, unit: V, history: false }
      current:    { addr: 33056, type: u16, scale: 0.1, unit: A, history: false }
      power:      { product: [pv4.voltage, pv4.current], unit: W }
      energy_out: { derive: share, of: pv.energy_out, by: power }
  battery:
    role: battery
    channels:
      power:      { addr: 33149, type: u32, scale: 1, unit: W, sign_from: { addr: 33135, type: u16, discharge_when: 1 } }
      soc:        { addr: 33139, type: u16, scale: 1, unit: "%" }
      energy_in:  { addr: 33163, type: u16, scale: 0.1, unit: kWh, counter: daily_reset, reset_group: daily, resolution: 0.1 }
      energy_out: { addr: 33167, type: u16, scale: 0.1, unit: kWh, counter: daily_reset, reset_group: daily, resolution: 0.1 }
      voltage:    { addr: 33133, type: u16, scale: 0.1, unit: V, history: false }
  grid:                   # the inverter's external meter, as evcc's solis-hybrid templates
    role: grid
    roles_allowed: [grid, inverter]
    channels:
      power:      { addr: 33263, type: i32, scale: 1, unit: W, invert: true }   # device: + = export
      energy_in:  { addr: 33283, type: u32, scale: 0.01, unit: kWh, counter: lifetime }
      energy_out: { addr: 33285, type: u32, scale: 0.01, unit: kWh, counter: lifetime }
  backup:
    role: backup
    channels:
      power:      { addr: 33148, type: u16, scale: 1, unit: W }
      energy_in:  { addr: 33596, type: u16, scale: 0.1, unit: kWh, counter: daily_reset, reset_group: daily, resolution: 0.1 }

status:
  operating:  { addr: 33095, type: u16, map: solis_status,
    label: { en: Operating state, de: Betriebszustand } }
  grid_fault: { addr: 33116, type: bitfield, map: solis_fault_33116,
    label: { en: Grid faults, de: Netzfehler } }
  backup_fault: { addr: 33117, type: bitfield, map: solis_fault_33117,
    label: { en: Backup faults, de: Backup-Fehler } }
  battery_fault: { addr: 33118, type: bitfield, map: solis_fault_33118,
    label: { en: Battery faults, de: Batteriefehler } }
  device_fault_4: { addr: 33119, type: bitfield, map: solis_fault_33119,
    label: { en: Device faults 1, de: Gerätefehler 1 } }
  device_fault_5: { addr: 33120, type: bitfield, map: solis_fault_33120,
    label: { en: Device faults 2, de: Gerätefehler 2 } }
  operating_bits: { addr: 33121, type: bitfield, map: solis_operating,
    label: { en: Operating flags, de: Betriebsflags } }
  bms_fault_1: { addr: 33145, type: bitfield, map: solis_bms_fault_1,
    label: { en: BMS faults 1, de: BMS-Fehler 1 } }
  bms_fault_2: { addr: 33146, type: bitfield, map: solis_bms_fault_2,
    label: { en: BMS faults 2, de: BMS-Fehler 2 } }

maps:
  solis_status:
    default: { level: fault }                       # any code >= 0x1000 not listed
    0x0000: { level: notice, text: { en: "Waiting", de: "Wartend" } }
    0x0001: { level: ok, text: { en: "Open run", de: "Anlauf" } }
    0x0002: { level: ok, text: { en: "Soft run", de: "Sanftanlauf" } }
    0x0003: { level: ok, text: { en: "Generating", de: "Erzeugt" } }
    0x0004: { level: notice, text: { en: "Standby", de: "Standby" } }
    0x0005: { level: notice, text: { en: "Standby synchronize", de: "Standby-Synchronisation" } }
    0x0006: { level: notice, text: { en: "Grid to load", de: "Netz versorgt Last" } }
    0x000F: { level: ok, text: { en: "Normal running", de: "Normalbetrieb" } }
    0x1004: { level: fault, text: { en: "Grid off", de: "Netz aus" } }
    0x1010: { level: fault, text: { en: "Grid overvoltage", de: "Netzüberspannung" } }
    0x1011: { level: fault, text: { en: "Grid undervoltage", de: "Netzunterspannung" } }
    0x1012: { level: fault, text: { en: "Grid over-frequency", de: "Netzüberfrequenz" } }
    0x1013: { level: fault, text: { en: "Grid under-frequency", de: "Netzunterfrequenz" } }
    0x1014: { level: fault, text: { en: "Grid impedance too high / reverse current", de: "Netzimpedanz zu hoch / Rückstrom" } }
    0x1015: { level: fault, text: { en: "No grid", de: "Kein Netz" } }
    0x1016: { level: fault, text: { en: "Unbalanced grid (phase fault)", de: "Netzunsymmetrie (Phasenfehler)" } }
