name: Checks

on:
  workflow_call: # reused by release.yml so a tag only ships after the checks pass
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency: # a newer push to a PR cancels its superseded run; main and tags always finish
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A push to main that is the merge commit of a PR skips the checks: the PR already
  # ran them. Direct pushes, PRs and release tags always run.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")] | length") || merged=0
            if [ "$merged" -gt 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  go:
    name: Build, test, deadcode, govulncheck
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify module tidiness
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -cover ./...

      - name: Dead code
        run: |
          DEAD=$(go tool deadcode -test ./...)
          if [ -n "$DEAD" ]; then echo "$DEAD"; exit 1; fi

      - name: Vulnerabilities
        run: go tool govulncheck ./...

      - name: Mocks up to date
        run: |
          # mockery fails on an empty package list (no interfaces yet)
          if grep -q '^  github.com' .mockery.yaml; then
            go tool mockery
            git diff --exit-code -- '*/mocks/*'
          fi

  golangci-lint:
    name: golangci-lint
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Lint + formatting (gofumpt, goimports) from .golangci.yml; covers function
      # length, complexity, magic numbers, global state and the panic policy.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config .golangci.yml

  frontend:
    name: Frontend typecheck, lint, knip, test, build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Includes the vue-i18n rules: missing and unused translation keys fail here.
      - run: npm run lint
      - run: npm run knip
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: dev
      - name: Bundle budget (spec 14)
        working-directory: .
        run: ./scripts/bundle-budget.sh

  docs:
    name: API docs and documentation site build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/package-lock.json

      # license stops on a license that is not allowed, VitePress on a dead link.
      - run: make license docs-site

  e2e:
    name: Frontend screenshots and accessibility
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Same image as `make e2e`, so the committed baselines match pixel for pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run e2e
